{% extends "board/_base.html" %}
{% block title %}Units{% endblock %}
{% block content %}
<h1>Units</h1>
<form method="get" action="/board/units" class="search-box">
  <div class="field">
    <label for="q">Search by address</label>
    <input type="text" id="q" name="q" value="{{ q }}" placeholder="e.g. 2214 Ann St">
  </div>
  <button type="submit" class="btn btn-secondary">Search</button>
</form>

<div class="table-wrap">
<table>
  <thead>
    <tr><th>Address</th><th>Active permits</th><th>Active guest passes</th><th></th></tr>
  </thead>
  <tbody>
    {% for row in units %}
    <tr>
      <td>{{ row.unit.address }}</td>
      <td>{{ row.vehicle_count }}</td>
      <td>{{ row.guest_pass_count }}</td>
      <td><a href="/board/units/{{ row.unit.id }}">View / edit</a></td>
    </tr>
    {% endfor %}
  </tbody>
</table>
</div>
{% endblock %}
